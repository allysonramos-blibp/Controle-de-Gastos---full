<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Controle Financeiro Pro</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea, #764ba2);
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e5e7eb;
            --input-bg: #ffffff;
            --shadow: rgba(0, 0, 0, .1);
        }

        body.dark-mode {
            --bg-gradient: #121212;
            --bg-card: #1e1e1e;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --input-bg: #2d2d2d;
            --shadow: rgba(0, 0, 0, .4);
        }

        *{margin:0;padding:0;box-sizing:border-box}

        body {
            font-family: 'Segoe UI', Tahoma, Verdana;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container { max-width: 1200px; margin: auto; }
        h1 { text-align: center; color: #fff; margin-bottom: 25px; }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card, .form-container {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px var(--shadow);
            margin-bottom: 20px;
        }

        .value { font-size: 2em; font-weight: bold; }
        .receitas .value { color: #10b981; }
        .despesas .value { color: #ef4444; }
        .saldo .value { color: #3b82f6; }

        .progress-container { background: #eee; border-radius: 10px; height: 18px; width: 100%; margin: 10px 0; overflow: hidden; }
        #barraMeta { background: #3b82f6; height: 100%; width: 0%; transition: width 0.5s ease; }

        .btn { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: #667eea; color: #fff; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-success { background: #10b981; color: #fff; }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: white; }
        .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border); }
        input, select { padding: 12px; border-radius: 8px; border: 2px solid var(--border); background: var(--input-bg); color: var(--text-primary); width: 100%; }
        .grafico-container { height: 300px; position: relative; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <div>Olá, <strong id="userName">Usuário</strong>! 👋</div>
        <div style="display: flex; gap: 10px;">
            <button id="themeToggle" class="btn" style="background: rgba(255,255,255,0.2); border: 1px solid white; color: white;">🌓 Tema</button>
            <button onclick="logout()" class="btn btn-danger">Sair</button>
        </div>
    </div>

    <h1>💰 Meu Controle Financeiro</h1>

    <div class="dashboard">
        <div class="card receitas"><h3>Receitas</h3><div class="value" id="totalReceitas">R$ 0,00</div></div>
        <div class="card despesas"><h3>Despesas</h3><div class="value" id="totalDespesas">R$ 0,00</div></div>
        <div class="card saldo"><h3>Saldo</h3><div class="value" id="saldo">R$ 0,00</div></div>
    </div>

    <div class="card">
        <h3>🎯 Meta Mensal (Limite: R$ 2.000,00)</h3>
        <div class="progress-container"><div id="barraMeta"></div></div>
        <small id="textoMeta">Calculando...</small>
    </div>

    <div class="form-container">
        <h2 id="formTitle">➕ Nova Transação</h2><br>
        <form id="form">
            <input type="hidden" id="transacaoId">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <input id="descricao" placeholder="Descrição" required>
                <input type="number" step="0.01" id="valor" placeholder="Valor" required>
                <input type="date" id="data" required>
                <select id="categoria">
                    <option value="ALIMENTACAO">🍕 Alimentação</option>
                    <option value="TRANSPORTE">🚗 Transporte</option>
                    <option value="MORADIA">🏠 Moradia</option>
                    <option value="LAZER">🎡 Lazer</option>
                    <option value="OUTROS">📦 Outros</option>
                </select>
                <select id="tipo"><option value="RECEITA">Receita</option><option value="DESPESA">Despesa</option></select>
                <select id="tipoPagamento"><option value="PIX">Pix</option><option value="DEBITO">Débito</option><option value="CARTAO_CREDITO">Cartão</option></select>
            </div><br>
            <button class="btn btn-primary" style="width: 100%">Salvar Transação</button>
        </form>
    </div>

    <div class="card">
        <h3>📊 Gastos por Categoria</h3>
        <div class="grafico-container"><canvas id="meuGrafico"></canvas></div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2>📋 Histórico</h2>
            <div style="display: flex; gap: 10px;">
                <select id="filtroMes" onchange="load()" style="width: auto;"></select>
                <select id="filtroAno" onchange="load()" style="width: auto;"></select>
                <button onclick="exportarPDF()" class="btn btn-success">📄 PDF</button>
            </div>
        </div>
        <div id="lista"></div>
    </div>
</div>

<script>
    // --- 1. VERIFICAÇÃO DE SEGURANÇA (COMENTADA PARA TESTE) ---
    const token = localStorage.getItem('token');

    // Substitua o IP fixo por essa lógica:
const API_BASE = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" 
    ? "http://localhost:8080" 
    : "https://SUA-URL-DO-RENDER.onrender.com";

const API = `${API_BASE}/api/transacoes`;

    const getHeaders = () => ({
        'Content-Type': 'application/json'
        // 'Authorization': `Bearer ${token}` // Comentado conforme solicitado para destravar
    });

    let chartInstance = null;

    function init() {
        document.getElementById('userName').innerText = localStorage.getItem('usuario_nome') || 'Usuário';
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

        document.getElementById('data').valueAsDate = new Date();
        const mesSel = document.getElementById('filtroMes');
        const anoSel = document.getElementById('filtroAno');
        const meses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];

        mesSel.innerHTML = "";
        anoSel.innerHTML = "";
        meses.forEach((m, i) => mesSel.add(new Option(m, i + 1)));
        const anoAtual = new Date().getFullYear();
        for(let i = anoAtual - 1; i <= anoAtual + 1; i++) { anoSel.add(new Option(i, i)); }

        mesSel.value = new Date().getMonth() + 1;
        anoSel.value = anoAtual;
        load();
    }

    async function load() {
        try {
            const res = await fetch(API, { headers: getHeaders() });
            const todosDados = await res.json();
            const m = document.getElementById('filtroMes').value;
            const a = document.getElementById('filtroAno').value;

            const dados = todosDados.filter(t => {
                const dt = new Date(t.data + 'T00:00:00');
                return (dt.getMonth() + 1) == m && dt.getFullYear() == a;
            });

            renderLista(dados);
            atualizarResumo(dados);
            atualizarGrafico(dados);
        } catch (e) { console.error("Erro ao carregar dados:", e); }
    }

    function renderLista(dados) {
        const lista = document.getElementById('lista');
        lista.innerHTML = '';
        dados.sort((x,y) => new Date(y.data) - new Date(x.data)).forEach(t => {
            lista.innerHTML += `
                <div class="transaction-item">
                    <div><strong>${getIcone(t.categoria)} ${t.descricao}</strong><br><small>${t.data} • ${t.tipoPagamento || 'N/A'}</small></div>
                    <div style="display:flex; align-items:center">
                        <span style="color: ${t.tipo === 'RECEITA' ? '#10b981' : '#ef4444'}; font-weight:bold; margin-right: 10px;">R$ ${t.valor.toFixed(2)}</span>
                        <button class="btn btn-primary" style="padding: 5px 8px; margin-right: 5px;" onclick="edit(${t.id})">✏️</button>
                        <button class="btn btn-danger" style="padding: 5px 8px;" onclick="del(${t.id})">🗑️</button>
                    </div>
                </div>`;
        });
    }

    function atualizarResumo(dados) {
        let rec = 0, des = 0;
        dados.forEach(t => t.tipo === 'RECEITA' ? rec += t.valor : des += t.valor);
        document.getElementById('totalReceitas').innerText = `R$ ${rec.toFixed(2)}`;
        document.getElementById('totalDespesas').innerText = `R$ ${des.toFixed(2)}`;
        document.getElementById('saldo').innerText = `R$ ${(rec - des).toFixed(2)}`;

        const meta = 2000;
        const perc = Math.min((des / meta) * 100, 100);
        document.getElementById('barraMeta').style.width = perc + '%';
        document.getElementById('textoMeta').innerText = `Você usou ${perc.toFixed(1)}% do limite de R$ ${meta}`;
    }

    function atualizarGrafico(dados) {
        const canvas = document.getElementById('meuGrafico');
        if(!canvas) return;
        const ctx = canvas.getContext('2d');
        const cats = {};
        dados.filter(t => t.tipo === 'DESPESA').forEach(t => cats[t.categoria] = (cats[t.categoria] || 0) + t.valor);

        if(chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(cats),
                datasets: [{ data: Object.values(cats), backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF'] }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    document.getElementById('form').onsubmit = async e => {
        e.preventDefault();
        const id = document.getElementById('transacaoId').value;
        const body = {
            descricao: document.getElementById('descricao').value,
            valor: parseFloat(document.getElementById('valor').value),
            data: document.getElementById('data').value,
            categoria: document.getElementById('categoria').value,
            tipo: document.getElementById('tipo').value,
            tipoPagamento: document.getElementById('tipoPagamento').value
        };

        await fetch(id ? `${API}/${id}` : API, {
            method: id ? 'PUT' : 'POST',
            headers: getHeaders(),
            body: JSON.stringify(body)
        });

        document.getElementById('form').reset();
        document.getElementById('transacaoId').value = '';
        document.getElementById('formTitle').innerText = "➕ Nova Transação";
        load();
    };

    async function del(id) {
        if(confirm('Excluir esta transação?')) {
            await fetch(`${API}/${id}`, { method: 'DELETE', headers: getHeaders() });
            load();
        }
    }

    async function edit(id) {
        const t = await fetch(`${API}/${id}`, { headers: getHeaders() }).then(r => r.json());
        document.getElementById('transacaoId').value = t.id;
        document.getElementById('descricao').value = t.descricao;
        document.getElementById('valor').value = t.valor;
        document.getElementById('data').value = t.data;
        document.getElementById('categoria').value = t.categoria;
        document.getElementById('tipo').value = t.tipo;
        document.getElementById('tipoPagamento').value = t.tipoPagamento;
        document.getElementById('formTitle').innerText = "✏️ Editar Transação";
        window.scrollTo(0,0);
    }

    function exportarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const mes = document.getElementById('filtroMes').options[document.getElementById('filtroMes').selectedIndex].text;
        const ano = document.getElementById('filtroAno').value;

        doc.text(`Relatorio Financeiro - ${mes}/${ano}`, 14, 15);
        const rows = [];
        document.querySelectorAll('.transaction-item').forEach(i => {
            rows.push([
                i.querySelector('strong').innerText,
                i.querySelector('small').innerText,
                i.querySelector('span').innerText
            ]);
        });
        doc.autoTable({
            startY: 25,
            head: [['Descricao', 'Info', 'Valor']],
            body: rows,
            theme: 'grid'
        });
        doc.save(`Relatorio_${mes}_${ano}.pdf`);
    }

    function getIcone(cat) {
        const icones = {'ALIMENTACAO': '🍕', 'TRANSPORTE': '🚗', 'MORADIA': '🏠', 'LAZER': '🎡', 'SAUDE': '💊', 'EDUCACAO': '📚'};
        return icones[cat] || '📦';
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }

    document.getElementById('themeToggle').onclick = () => {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    };

    init();
</script>
</body>

</html>
