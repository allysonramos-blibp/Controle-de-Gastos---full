<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h3 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .card .value {
            font-size: 2em;
            font-weight: bold;
            margin-top: 5px;
        }

        .receitas .value { color: #10b981; }
        .despesas .value { color: #ef4444; }
        .saldo .value { color: #3b82f6; }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .form-container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            color: #666;
            font-weight: 500;
        }

        input, select {
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1em;
            transition: border 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .transactions-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            transition: background 0.2s;
        }

        .transaction-item:hover {
            background: #f9fafb;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-desc {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .transaction-meta {
            font-size: 0.85em;
            color: #666;
        }

        .transaction-value {
            font-size: 1.3em;
            font-weight: bold;
            margin-right: 15px;
        }

        .transaction-value.receita {
            color: #10b981;
        }

        .transaction-value.despesa {
            color: #ef4444;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-receita {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-despesa {
            background: #fee2e2;
            color: #991b1b;
        }

        .relatorio-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .relatorio-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        .relatorio-item:last-child {
            border-bottom: none;
        }

        .categoria-nome {
            font-weight: 600;
            color: #333;
        }

        .categoria-stats {
            text-align: right;
        }

        .categoria-total {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
        }

        .categoria-qtd {
            font-size: 0.85em;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>💰 Controle de Gastos</h1>

    <!-- Dashboard -->
    <div class="dashboard">
        <div class="card receitas">
            <h3>Receitas</h3>
            <div class="value" id="totalReceitas">R$ 0,00</div>
        </div>
        <div class="card despesas">
            <h3>Despesas</h3>
            <div class="value" id="totalDespesas">R$ 0,00</div>
        </div>
        <div class="card saldo">
            <h3>Saldo</h3>
            <div class="value" id="saldo">R$ 0,00</div>
        </div>
    </div>

    <!-- Formulário -->
    <div class="form-container">
        <h2>➕ Nova Transação</h2>
        <form id="transacaoForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Descrição</label>
                    <input type="text" id="descricao" required>
                </div>
                <div class="form-group">
                    <label>Valor (R$)</label>
                    <input type="number" id="valor" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Data</label>
                    <input type="date" id="data" required>
                </div>
                <div class="form-group">
                    <label>Categoria</label>
                    <select id="categoria" required>
                        <option value="">Selecione...</option>
                        <option value="ALIMENTACAO">Alimentação</option>
                        <option value="TRANSPORTE">Transporte</option>
                        <option value="MORADIA">Moradia</option>
                        <option value="LAZER">Lazer</option>
                        <option value="SAUDE">Saúde</option>
                        <option value="EDUCACAO">Educação</option>
                        <option value="OUTROS">Outros</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tipo</label>
                    <select id="tipo" required>
                        <option value="">Selecione...</option>
                        <option value="RECEITA">Receita</option>
                        <option value="DESPESA">Despesa</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Adicionar Transação</button>
        </form>
    </div>

    <!-- Filtros -->
    <div class="filters">
        <button class="btn btn-primary" onclick="carregarTransacoes()">Todas</button>
        <button class="btn btn-success" onclick="filtrarPorTipo('RECEITA')">Receitas</button>
        <button class="btn btn-danger" onclick="filtrarPorTipo('DESPESA')">Despesas</button>
    </div>

    <!-- Transações -->
    <div class="transactions-container">
        <h2>📋 Transações</h2>
        <div id="transacoesList"></div>
    </div>

    <!-- Relatório por Categoria -->
    <div class="relatorio-container">
        <h2>📊 Relatório por Categoria</h2>
        <div id="relatorioList"></div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api/transacoes';

    // Inicialização
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('data').valueAsDate = new Date();
        carregarDados();
    });

    // Enviar formulário
    document.getElementById('transacaoForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const transacao = {
            descricao: document.getElementById('descricao').value,
            valor: parseFloat(document.getElementById('valor').value),
            data: document.getElementById('data').value,
            categoria: document.getElementById('categoria').value,
            tipo: document.getElementById('tipo').value
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(transacao)
            });

            if (response.ok) {
                alert('Transação adicionada com sucesso!');
                document.getElementById('transacaoForm').reset();
                document.getElementById('data').valueAsDate = new Date();
                carregarDados();
            }
        } catch (error) {
            alert('Erro ao adicionar transação: ' + error);
        }
    });

    // Carregar todos os dados
    async function carregarDados() {
        await carregarTransacoes();
        await carregarSaldo();
        await carregarRelatorio();
    }

    // Carregar transações
    async function carregarTransacoes() {
        try {
            const response = await fetch(API_URL);
            const transacoes = await response.json();
            exibirTransacoes(transacoes);
        } catch (error) {
            document.getElementById('transacoesList').innerHTML =
                '<div class="empty-state">Erro ao carregar transações</div>';
        }
    }

    // Filtrar por tipo
    async function filtrarPorTipo(tipo) {
        try {
            const response = await fetch(`${API_URL}/tipo/${tipo}`);
            const transacoes = await response.json();
            exibirTransacoes(transacoes);
        } catch (error) {
            alert('Erro ao filtrar: ' + error);
        }
    }

    // Exibir transações
    function exibirTransacoes(transacoes) {
        const lista = document.getElementById('transacoesList');

        if (transacoes.length === 0) {
            lista.innerHTML = '<div class="empty-state">Nenhuma transação encontrada</div>';
            return;
        }

        lista.innerHTML = transacoes.map(t => `
                <div class="transaction-item">
                    <div class="transaction-info">
                        <div class="transaction-desc">${t.descricao}</div>
                        <div class="transaction-meta">
                            ${formatarData(t.data)} • ${t.categoria}
                        </div>
                    </div>
                    <span class="badge badge-${t.tipo.toLowerCase()}">${t.tipo}</span>
                    <div class="transaction-value ${t.tipo.toLowerCase()}">
                        ${t.tipo === 'RECEITA' ? '+' : '-'} R$ ${t.valor.toFixed(2)}
                    </div>
                </div>
            `).join('');
    }

    // Carregar saldo
    async function carregarSaldo() {
        try {
            const response = await fetch(`${API_URL}/saldo`);
            const saldo = await response.json();
            document.getElementById('saldo').textContent = `R$ ${saldo.toFixed(2)}`;

            // Carregar receitas e despesas
            const responseReceitas = await fetch(`${API_URL}/tipo/RECEITA`);
            const receitas = await responseReceitas.json();
            const totalReceitas = receitas.reduce((sum, t) => sum + t.valor, 0);
            document.getElementById('totalReceitas').textContent = `R$ ${totalReceitas.toFixed(2)}`;

            const responseDespesas = await fetch(`${API_URL}/tipo/DESPESA`);
            const despesas = await responseDespesas.json();
            const totalDespesas = despesas.reduce((sum, t) => sum + t.valor, 0);
            document.getElementById('totalDespesas').textContent = `R$ ${totalDespesas.toFixed(2)}`;
        } catch (error) {
            console.error('Erro ao carregar saldo:', error);
        }
    }

    // Carregar relatório
    async function carregarRelatorio() {
        try {
            const response = await fetch(`${API_URL}/relatorio/categoria`);
            const relatorio = await response.json();

            const lista = document.getElementById('relatorioList');

            if (relatorio.length === 0) {
                lista.innerHTML = '<div class="empty-state">Nenhum dado disponível</div>';
                return;
            }

            lista.innerHTML = relatorio.map(item => `
                    <div class="relatorio-item">
                        <div class="categoria-nome">${item.categoria}</div>
                        <div class="categoria-stats">
                            <div class="categoria-total">R$ ${item.total.toFixed(2)}</div>
                            <div class="categoria-qtd">${item.quantidade} transação(ões)</div>
                        </div>
                    </div>
                `).join('');
        } catch (error) {
            document.getElementById('relatorioList').innerHTML =
                '<div class="empty-state">Erro ao carregar relatório</div>';
        }
    }

    // Formatar data
    function formatarData(data) {
        const d = new Date(data + 'T00:00:00');
        return d.toLocaleDateString('pt-BR');
    }
</script>
</body>
</html>
